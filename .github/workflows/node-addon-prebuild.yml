# Requires repo secret: PERSONAL_ACCESS_TOKEN with permissions:
#   Contents: read and write
#   Pull Requests: read and write

name: Node.js Native Addons Prebuild

on:
  # Pull requests from forks build and test the addons, but they can't sign or commit prebuilds;
  #   node-addon-provenance.yml explains how a maintainer supplies them
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate branches here so that the 'prebuild-status-check' job can still run
  branch-gate:
    if: ${{ github.actor == 'emmercm' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      should-prebuild: ${{ steps.branch-gate.outputs.should-prebuild }}
    steps:
      - id: branch-gate
        run: |
          set -x
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          # Don't prebuild on version bump branches (e.g. 'emmercm/1.2.3')
          if [[ "${branch}" =~ /[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "should-prebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should-prebuild=true" >> "${GITHUB_OUTPUT}"
          fi

  path-filter:
    if: ${{ github.actor == 'emmercm' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    permissions:
      pull-requests: read # dorny/paths-filter
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.change-filter.outputs.changes == 'true' && steps.commit-filter.outputs.changes == 'false' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2 # commit-filter
      # Prebuild if any relevant source file has changed
      - id: change-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changes:
              - '.github/actions/checkout-submodules/**'
              - '.github/workflows/node-addon-prebuild.yml'
              - '.gitmodules'
              - 'packages/7zip/**'
              - 'packages/chdman/**'
              - 'packages/dolphin-tool/**'
              - 'packages/maxcso/**'
              - 'packages/zlib*/**'
              - 'packages/zstd*/**'
              - 'package*.json'
      # DON'T prebuild if the last commit was prebuilds
      - id: commit-filter
        run: |
          if git diff --quiet HEAD~1 HEAD -- 'packages/*/addon-*/**'; then
            echo "changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changes=true" >> "${GITHUB_OUTPUT}"
          fi

  prebuild:
    name: prebuildify (${{ matrix.os }}, ${{ matrix.docker_arch || 'default' }})
    needs:
      - branch-gate
      - path-filter
    if: ${{ (needs.branch-gate.outputs.should-prebuild == 'true' && needs.path-filter.outputs.changes == 'true') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          # docker manifest inspect node:<version> | jq '.manifests[].platform'
          - os: ubuntu-latest
            docker_arch: linux/amd64
          - os: ubuntu-24.04-arm
            docker_arch: linux/arm64/v8
          - os: ubuntu-24.04-arm
            docker_arch: linux/arm/v7
          - os: macos-15-intel
          - os: macos-latest
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # QEMU cross-builds
    env:
      JOBS: max # node-gyp: compile using all available CPUs
    steps:
      # Setup and install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout-submodules
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          node-version: 22

      # Prebuild
      - run: |
          npm ci --ignore-scripts

      - if: ${{ startsWith(matrix.os, 'ubuntu') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Prebuilds are published, so they must never restore a (possibly poisoned) cache
          cache-image: false
      - id: linux-vars
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        name: Determine Linux Docker architecture
        run: |
          set -x
          echo "VERSIONS_NODE=$(node --print 'process.versions.node')" >> "${GITHUB_OUTPUT}"

          DOCKER_ARCH=${{ matrix.docker_arch }}
          DOCKER_ARCH=${DOCKER_ARCH/linux\//}
          DOCKER_ARCH=${DOCKER_ARCH//\//}
          echo "DOCKER_ARCH=${DOCKER_ARCH}" >> "${GITHUB_OUTPUT}"
      - id: build-docker
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        name: Build Linux addons
        uses: ./.github/actions/docker-run-action
        with:
          image: node:${{ steps.linux-vars.outputs.VERSIONS_NODE }}
          shell: bash
          options: |
            --platform ${{ matrix.docker_arch }}
            --volume ${{ github.workspace }}:/build
            --workdir /build
            --env JOBS=${{ env.JOBS }}
          run: |
            set -euo pipefail
            set -x
            uname -a

            find packages -maxdepth 1 -type d \( -name "7zip*" -o -name "chdman*" -o -name "dolphin-tool*" -o -name "maxcso*" -o -name "zlib*" -o -name "zstd*" \) | while IFS= read -r dir; do
              cd "${dir}"
              rm -rf addon-*
              ../../node_modules/.bin/prebuildify --target "$(node --print 'process.versions.node')" --napi --strip --out "addon-$(basename "$(pwd)")"
              cd ../..
            done
            find packages/*/addon-* -type f -print0 | xargs -0 ls -al

            # Test the build
            rm -rf packages/*/build
            npm ci --foreground-scripts
            npm run test:unit packages

      - id: build
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        name: Build ${{ runner.os }} addons
        shell: bash
        run: |
          set -x
          node --print 'process'
          find packages -maxdepth 1 -type d \( -name "7zip*" -o -name "chdman*" -o -name "dolphin-tool*" -o -name "maxcso*" -o -name "zlib*" -o -name "zstd*" \) | while IFS= read -r dir; do
            cd "${dir}"
            rm -rf addon-*
            ../../node_modules/.bin/prebuildify --target "$(node --print 'process.versions.node')" --napi --strip --out "addon-$(basename "$(pwd)")"
            cd ../..
          done
          find packages/*/addon-* -type f -print0 | xargs -0 ls -al

          # Test the build
          rm -rf packages/*/build
          npm ci --foreground-scripts
          npm run test:unit packages

      # Validate the prebuilt addons have no unexpected shared-library dependencies
      - if: ${{ startsWith(matrix.os, 'ubuntu') }}
        name: Validate Linux addon dependencies
        run: |
          allowed_needed='^(ld-linux.*|ld-musl.*|libc|libm|libmvec|libdl|libpthread|librt|libgcc_s|libatomic|libstdc\+\+)\.so'
          validation_failures=0
          while IFS= read -r -d '' addon; do
            echo "==> ${addon}"
            needed="$(readelf -d "${addon}" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')"
            while IFS= read -r lib; do
              [ -z "${lib}" ] && continue
              echo "    NEEDED: ${lib}"
              if ! [[ "${lib}" =~ ${allowed_needed} ]]; then
                echo "  FAIL: unexpected dynamic dependency: ${lib}"
                validation_failures=$((validation_failures + 1))
              fi
            done <<< "${needed}"
            glibc_max="$(readelf --dyn-syms -W "${addon}" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -n 1 || true)"
            [ -n "${glibc_max}" ] && echo "  Requires (informational): ${glibc_max}"
          done < <(find packages -type f -path '*/addon-*/*.node' -print0)
          [ "${validation_failures}" -eq 0 ] || { echo "Native addon validation FAILED with ${validation_failures} problem(s)."; exit 1; }
      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: Validate macOS addon dependencies
        run: |
          validation_failures=0
          while IFS= read -r -d '' addon; do
            echo "==> ${addon}"
            deps="$(otool -L "${addon}" | tail -n +2 | awk '{print $1}')"
            while IFS= read -r dep; do
              [ -z "${dep}" ] && continue
              echo "    ${dep}"
              if ! [[ "${dep}" =~ ^/usr/lib/ || "${dep}" =~ ^/System/Library/Frameworks/ ]]; then
                echo "  FAIL: unexpected linked dylib: ${dep}"
                validation_failures=$((validation_failures + 1))
              fi
            done <<< "${deps}"
          done < <(find packages -type f -path '*/addon-*/*.node' -print0)
          [ "${validation_failures}" -eq 0 ] || { echo "Native addon validation FAILED with ${validation_failures} problem(s)."; exit 1; }
      - if: ${{ startsWith(matrix.os, 'windows') }}
        name: Validate Windows addon dependencies
        shell: bash
        run: |
          dumpbin="$(command -v dumpbin || true)"
          if [ -z "${dumpbin}" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ -x "${vswhere}" ]; then
              install="$("${vswhere}" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')"
              [ -n "${install}" ] && dumpbin="$(find "${install}/VC/Tools/MSVC" -name dumpbin.exe -path '*Hostx64*' | sort | tail -n 1)"
            fi
          fi
          allowed_dll='^(kernel32|kernelbase|ntdll|advapi32|user32|shell32|shlwapi|ole32|oleaut32|combase|rpcrt4|ws2_32|bcrypt|crypt32|secur32|userenv|version|winmm|gdi32|dbghelp|psapi|iphlpapi|msvcrt|ucrtbase|vcruntime140|vcruntime140_1|msvcp140|concrt140|node)\.(dll|exe)$'
          validation_failures=0
          while IFS= read -r -d '' addon; do
            echo "==> ${addon}"
            if [ -z "${dumpbin}" ]; then
              echo "  WARNING: dumpbin not found; skipping dependency check for ${addon}"
              continue
            fi
            deps="$("${dumpbin}" //dependents "${addon}" | tr -d '\r' | grep -iE '\.dll$' | awk '{print $1}')"
            while IFS= read -r dep; do
              [ -z "${dep}" ] && continue
              echo "    ${dep}"
              lower="$(echo "${dep}" | tr '[:upper:]' '[:lower:]')"
              case "${lower}" in api-ms-win-* | ext-ms-win-*) continue ;; esac
              if ! [[ "${lower}" =~ ${allowed_dll} ]]; then
                echo "  FAIL: unexpected dependent DLL: ${dep}"
                validation_failures=$((validation_failures + 1))
              fi
            done <<< "${deps}"
          done < <(find packages -type f -path '*/addon-*/*.node' -print0)
          [ "${validation_failures}" -eq 0 ] || { echo "Native addon validation FAILED with ${validation_failures} problem(s)."; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.os }}-${{ steps.linux-vars.outputs.DOCKER_ARCH }}
          path: packages/*/addon-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  cpp-lint:
    needs:
      - branch-gate
      - path-filter
    if: ${{ (needs.branch-gate.outputs.should-prebuild == 'true' && needs.path-filter.outputs.changes == 'true') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read # actions/checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout-submodules
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

          python3 -m venv "${RUNNER_TEMP}/clang"
          "${RUNNER_TEMP}/clang/bin/pip" install --requirement packages/requirements.txt
          echo "${RUNNER_TEMP}/clang/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/clang/bin/clang-format" --version
          "${RUNNER_TEMP}/clang/bin/clang-tidy" --version

      - name: clang-format
        run: |
          set -x
          mapfile -t cpp_files < <(find packages -type f \( -name '*.cpp' -o -name '*.cc' \) \
            -not -path '*/deps/*' -not -path '*/build/*' -not -path '*/addon-*/*' | sort)
          printf 'Checking: %s\n' "${cpp_files[@]}"
          clang-format --dry-run --Werror "${cpp_files[@]}"

      - name: clang-tidy
        run: |
          set -x
          for gyp in packages/*/binding.gyp; do
            pkg=$(dirname "${gyp}")
            ( cd "${pkg}" && ../../node_modules/.bin/node-gyp configure -- -f compile_commands_json )
            mapfile -t pkg_files < <(find "${pkg}" -type f \( -name '*.cpp' -o -name '*.cc' \) \
              -not -path '*/deps/*' -not -path '*/build/*' -not -path '*/addon-*/*' | sort)
            printf 'Linting %s: %s\n' "${pkg}" "${pkg_files[*]}"
            clang-tidy \
              --warnings-as-errors='*' \
              `# Dolphin's vendored 'fmt' changes its behavior when this is defined, so we undefine it` \
              --extra-arg=-U__clang_analyzer__ \
              -p "${pkg}/build/Release" \
              "${pkg_files[@]}"
          done

  commit:
    needs:
      - prebuild
      - cpp-lint
    # Pull requests from forks can't sign or push
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read # actions/checkout
      id-token: write # actions/attest
      attestations: write # actions/attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: ignore[artipacked] The persisted credentials are required for the
          #   subsequent `git push` that commits the prebuilds back to the branch.
          # Check out the commit that was built, so that the prebuilds are committed directly on top
          #   of it. Otherwise, 'pull_request' would check out the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Token needed so that the push triggers Actions (i.e. 'pull_request' and node-addon-provenance.yml)
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - run: |
          set -x
          find packages/*/addon-* -type f -print0 | xargs -0 ls -al
          rm -rf packages/*/addon-*/
          find packages/*/addon-* -type f -print0 | xargs -0 ls -al
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/
          merge-multiple: true
      # Sign the prebuilds so that node-addon-provenance.yml can verify they were built by this workflow
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'packages/*/addon-*/**'
      - id: bump-and-commit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -x
          find packages/*/addon-* -type f -print0 | xargs -0 ls -al
          git add --all packages
          git status

          USER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          echo "USER_EMAIL=${USER_EMAIL}" >> "${GITHUB_OUTPUT}"
          git config user.email "${USER_EMAIL}"

          USER_NAME="github-actions[bot]"
          echo "USER_NAME=${USER_NAME}" >> "${GITHUB_OUTPUT}"
          git config user.name "${USER_NAME}"

          git commit -m "prebuilds @ https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" || exit 0
          # HEAD is detached; if the branch has moved since this run was triggered, the push is
          #   rejected as a non-fast-forward instead of committing prebuilds for stale source
          git push origin "HEAD:refs/heads/${BRANCH}"

  # !!! This check should be required by GitHub !!!
  prebuild-status-check:
    needs:
      - path-filter
      - branch-gate
      - prebuild
      - cpp-lint
      - commit
    if: always()
    permissions: { }
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: path-filter, branch-gate, prebuild, cpp-lint, commit
