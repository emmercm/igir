name: Node.js Test Package

on:
  pull_request:
    types:
      # Types run for by default
      - opened
      - reopened
      - synchronize
      # Merged
      - closed
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-filter:
    permissions:
      pull-requests: read # dorny/paths-filter
    runs-on: ubuntu-latest
    outputs:
      source-changes: ${{ steps.filter.outputs.source-changes }}
      package-changes: ${{ steps.filter.outputs.package-changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            source-changes:
              - '.github/workflows/node-test-package.yml'
              - 'addons/**'
              - 'packages/**'
              - 'scripts/build.ts'
              - 'src/**'
              - 'index.ts'
              - 'package*.json'
              - 'tsconfig.json'
            package-changes:
              - '.github/workflows/node-test-package.yml'
              - 'addons/**'
              - 'packages/**'
              - 'scripts/build.ts'
              - 'index.ts'
              - 'package*.json'
              - 'tsconfig.json'

  pkg-pr-new:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.source-changes == 'true' }}
    permissions:
      contents: read # actions/checkout
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.pkg-pr-new.outputs.PACKAGE_NAME }}
      package_url: ${{ steps.pkg-pr-new.outputs.PACKAGE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - id: pkg-pr-new
        run: |
          set -x
          npm ci
          npx --yes pkg-pr-new publish --compact --json pkg.json --comment=off
          cat pkg.json
          echo "PACKAGE_NAME=$(jq --raw-output '.packages[0].name' pkg.json)" >> "${GITHUB_OUTPUT}"
          echo "PACKAGE_URL=$(jq --raw-output '.packages[0].url' pkg.json)" >> "${GITHUB_OUTPUT}"

  test-npx:
    name: test-npx (${{ matrix.os }})
    needs:
      - pkg-pr-new
    if: ${{ startsWith(github.event_name, 'pull_request') && github.event.action != 'closed' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - run: |
          npm exec --yes --foreground-scripts "${{ needs.pkg-pr-new.outputs.package_url }}" -- --help

  # TODO(cemmer): bunx testing, https://github.com/oven-sh/bun/issues/17946

  test-npm-install-global:
    name: test-npm-install-global (${{ matrix.os }})
    needs:
      - pkg-pr-new
    if: ${{ startsWith(github.event_name, 'pull_request') && github.event.action != 'closed' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - shell: bash
        run: |
          set -x
          npm install --global --foreground-scripts "${{ needs.pkg-pr-new.outputs.package_url }}"
          PATH="$(npm get prefix --global)/bin:$PATH"
          export PATH
          igir --help

  test-wasm-fallback:
    name: test-wasm-fallback (${{ matrix.os }})
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.package-changes == 'true' && startsWith(github.event_name, 'pull_request') && github.event.action != 'closed' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          node-version: 22
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          # Only the root lockfile, so hashFiles() doesn't walk the submodules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --ignore-scripts
      - name: Pack and use the native addons' WebAssembly builds
        shell: bash
        run: |
          set -euxo pipefail

          # Pack
          npm pack --script-shell bash
          tarball="$(pwd)/$(ls igir-*.tgz)"

          # Install the tarball
          project="${RUNNER_TEMP}/wasm-fallback"
          mkdir -p "${project}"
          cd "${project}"
          npm init --yes
          npm install "${tarball}"
          cd node_modules/igir

          # Load every addon's WebAssembly builds, the same as each addon falls back to on a
          # platform without prebuilds
          node --input-type=module --eval "
            import fs from 'node:fs';
            import module from 'node:module';
            import path from 'node:path';
            const require = module.createRequire(path.join(process.cwd(), 'package.json'));
            const { getDefaultContext } = require('@emnapi/runtime');
            for (const addon of fs.readdirSync(path.join('dist', 'addons'))) {
              const glues = fs
                .readdirSync(path.join('dist', 'addons', addon), { recursive: true })
                .filter((file) => path.basename(path.dirname(file)) === 'wasm' && file.endsWith('.cjs'));
              if (glues.length === 0) {
                throw new Error('no WebAssembly build for the ' + addon + ' addon');
              }
              for (const glue of glues) {
                const binding = require(path.resolve('dist', 'addons', addon, glue)).emnapiInit({ context: getDefaultContext() });
                console.log(addon, glue, Object.keys(binding));
              }
            }
          "

  # !!! This check should be required by GitHub !!!
  test-package-status-check:
    needs:
      - pkg-pr-new
      - test-npx
      - test-npm-install-global
      - test-wasm-fallback
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pkg-pr-new, test-npx, test-npm-install-global, test-wasm-fallback

  npm-exec-branch-comment:
    needs:
      - pkg-pr-new
      - test-npx
      - test-npm-install-global
    # TODO(cemmer): need pull_request_target to comment
    if: ${{ github.event.pull_request.user.login == 'emmercm' && startsWith(github.event_name, 'pull_request') && github.event.action != 'closed' }}
    permissions:
      pull-requests: write # thollander/actions-comment-pull-request
    runs-on: ubuntu-latest
    steps:
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## :test_tube: Package testing instructions
            This pull request can be tested locally with the following command:
            ```shell
            npx --yes "${{ needs.pkg-pr-new.outputs.package_url }}" [commands..] [options]
            ```
            _Comment generated by the [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}) workflow._
          comment-tag: npm-exec

  npm-exec-merge-comment:
    needs:
      - path-filter
    # TODO(cemmer): need pull_request_target to comment
    if: ${{ github.event.pull_request.user.login == 'emmercm' && needs.path-filter.outputs.source-changes == 'true' && startsWith(github.event_name, 'pull_request') && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' }}
    permissions:
      pull-requests: write # thollander/actions-comment-pull-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - id: package
        run: |
          echo "PACKAGE_NAME=$(jq --raw-output '.name' package.json)" >> "${GITHUB_OUTPUT}"
      - run: |
          npx --yes "https://pkg.pr.new/${PACKAGE_NAME}@${BASE_REF}" --help
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.PACKAGE_NAME }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## :test_tube: Package testing instructions
            This pull request has been merged, its base branch can be tested locally with the following command:
            ```shell
            npx --yes "https://pkg.pr.new/${{ steps.package.outputs.PACKAGE_NAME }}@${{ github.event.pull_request.base.ref }}" [commands..] [options]
            ```
            _Comment generated by the [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}) workflow._
          comment-tag: npm-exec
          mode: recreate
