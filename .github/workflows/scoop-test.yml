name: Scoop Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (refs/heads/<branch>, refs/tags/<tag>, etc.) or SHA'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  ref: ${{ inputs.ref || github.sha || github.ref }}

jobs:
  path-filter:
    permissions:
      pull-requests: read # dorny/paths-filter
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.filter.outputs.should-test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            should-test:
              - '.github/workflows/scoop-test.yml'
              - 'bucket/*.json'

  # The manifest validation is architecture-agnostic, so only run it once
  scoop-validate:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
      pull-requests: read # explicitly deny ScoopInstaller/GithubActions comment and label permissions
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}

      # Lint the bucket manifest(s)
      - shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Invoke-WebRequest -UseBasicParsing -Uri 'https://get.scoop.sh' -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"

          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\formatjson.ps1" -Dir .\bucket
      - shell: bash
        run: |
          if git diff --exit-code -- bucket/; then
            exit 0
          fi
          {
            echo '## Scoop manifest formatting'
            echo ''
            # shellcheck disable=SC2016,SC2028
            echo 'Run `scoop\apps\scoop\current\bin\formatjson.ps1 -Dir .\bucket` and commit the result:'
            echo ''
            echo '```diff'
            git diff --no-color -- bucket/
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Scoop manifests aren't formatted, see the job summary for the expected changes"
          exit 1

      # Gate on event name because otherwise the action will push on anything other than pull_request, issue_comment, and issues
      - if: ${{ github.event_name == 'pull_request' }}
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0

  scoop-test:
    name: scoop-test (${{ matrix.os }})
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Invoke-WebRequest -UseBasicParsing -Uri 'https://get.scoop.sh' -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"

          scoop install .\bucket\igir.json

          igir --help

  # !!! This check should be required by GitHub !!!
  scoop-status-check:
    needs:
      - path-filter
      - scoop-validate
      - scoop-test
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: scoop-validate, scoop-test
