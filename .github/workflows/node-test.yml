# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
# https://hanxiao.io/2021/01/24/Speedup-CI-Workflow-in-Github-Actions-via-Strategy-Matrix/

name: Node.js Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (refs/heads/<branch>, refs/tags/<tag>, etc.) or SHA'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  ref: ${{ inputs.ref || github.sha || github.ref }}

jobs:
  path-filter:
    permissions:
      pull-requests: read # dorny/paths-filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-test: ${{ steps.filter.outputs.should-test }}
      should-delete-prebuilds: ${{ steps.filter.outputs.should-delete-prebuilds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            should-test:
              - '.github/workflows/node-test.yml'
              - 'packages/**'
              - 'src/**'
              - 'test/**'
              - '**/*.ts'
              - '.bun-version'
              - 'bunfig.toml'
              - 'index.ts'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vitest.config.json'
            should-delete-prebuilds:
              - '.github/workflows/node-addon-prebuild.yml'
              - '.gitmodules'
              - 'packages/7zip/**'
              - 'packages/chdman/**'
              - 'packages/dolphin-tool/**'
              - 'packages/maxcso/**'
              - 'packages/zlib*/**'
              - 'packages/zstd*/**'
              - 'package*.json'
              - 'postinstall.mjs'

  node-lint:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Setup and install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --foreground-scripts
      - run: npm run lint

  # TODO(cemmer): check for deprecated dependencies
  # https://stackoverflow.com/questions/44097267/find-packages-that-give-deprecated-warning-npm

  node-unit:
    name: node-unit (${{ matrix.os }}, ${{ matrix.node-version || 'package.json' }})
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm ]
        node-version: [ '' ]
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Setup and install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
          submodules: ${{ needs.path-filter.outputs.should-delete-prebuilds == 'true' && 'recursive' || '' }}
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --ignore-scripts
      - if: ${{ needs.path-filter.outputs.should-delete-prebuilds == 'true' }}
        shell: bash
        run: |
          rm -rf packages/*/addon-* packages/*/prebuilds*
      - run: npm install --foreground-scripts

      # Test the source files
      - run: npm run test:unit

  # TODO(cemmer): temporary, remove once the Windows ARM64 maxcso crash's call site is known.
  # Vitest's maxcso test process intermittently aborts (exit code 0xC0000409) after libuv's
  # "Assertion failed: !(handle->flags & UV_HANDLE_CLOSING), file src\win\async.c", which only
  # Windows' libuv asserts. Capture a crash dump to find which uv_async_send() races a uv_close().
  maxcso-crash-dump:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      JOBS: max # node-gyp: compile using all available CPUs
      DUMP_DIR: ${{ github.workspace }}\crash-dumps
    steps:
      # Setup and install, building every addon from source like node-unit did when it crashed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
          submodules: recursive
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          rm -rf packages/*/addon-* packages/*/prebuilds*
      - run: npm install --foreground-scripts

      # Capture node.exe crashes: attach cdb to the test run when it's installed, otherwise install
      # ProcDump as the postmortem debugger; Windows Error Reporting local dumps stay as a backstop
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:DUMP_DIR}" | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          Set-ItemProperty -Path $wer -Name Disabled -Type DWord -Value 0
          Set-ItemProperty -Path $wer -Name DontShowUI -Type DWord -Value 1
          $localDumps = "$wer\LocalDumps\node.exe"
          New-Item -Force -Path $localDumps | Out-Null
          Set-ItemProperty -Path $localDumps -Name DumpFolder -Type ExpandString -Value "${env:DUMP_DIR}"
          Set-ItemProperty -Path $localDumps -Name DumpType -Type DWord -Value 2
          Set-ItemProperty -Path $localDumps -Name DumpCount -Type DWord -Value 5
          Set-Service -Name WerSvc -StartupType Manual -ErrorAction Continue
          Start-Service -Name WerSvc -ErrorAction Continue
          Get-Service -Name WerSvc | Format-List Name, Status, StartType

          $nodeVersion = node --print process.versions.node
          $nodePdbDir = Join-Path "${env:RUNNER_TEMP}" 'node-pdb'
          Invoke-WebRequest -Uri "https://nodejs.org/download/release/v${nodeVersion}/win-arm64/node_pdb.zip" -OutFile "${nodePdbDir}.zip"
          Expand-Archive -Path "${nodePdbDir}.zip" -DestinationPath $nodePdbDir -Force
          "NODE_PDB_DIR=${nodePdbDir}" >> "${env:GITHUB_ENV}"

          $cdbs = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue
          $cdbs | ForEach-Object { Write-Output "Found $($_.FullName)" }
          $cdb = $cdbs | Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1
          if ($cdb) {
            "CDB=$($cdb.FullName)" >> "${env:GITHUB_ENV}"
          } else {
            Write-Output "No arm64 cdb.exe is installed, installing ProcDump as the postmortem debugger"
            $procdumpDir = Join-Path "${env:RUNNER_TEMP}" 'procdump'
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile "${procdumpDir}.zip"
            Expand-Archive -Path "${procdumpDir}.zip" -DestinationPath $procdumpDir -Force
            & "${procdumpDir}\procdump64a.exe" -accepteula -ma -i "${env:DUMP_DIR}"
          }

      # Run the maxcso tests until one crashes, under cdb (following child processes) when it's
      # installed so the fail-fast prints every thread's stack as it happens
      - id: repro
        shell: pwsh
        run: |
          $symbolPath = "${env:NODE_PDB_DIR};$(Resolve-Path packages\maxcso\addon-maxcso\build\Release);srv*${env:RUNNER_TEMP}\symbols*https://msdl.microsoft.com/download/symbols"
          $dumpPath = "${env:DUMP_DIR}\node.dmp" -replace '\\', '/'
          $onFailFast = ".echo FAIL-FAST; .ecxr; kn 50; ~*kn 50; .dump /ma /u ${dumpPath}; g"
          $cdbScript = Join-Path "${env:RUNNER_TEMP}" 'cdb-commands.txt'
          @(
            # V8 and libuv can raise first-chance access violations they handle themselves
            'sxd av'
            'sxn ibp'
            'sxn ld'
            'sxn ud'
            "sxe -c `"${onFailFast}`" -c2 `"${onFailFast}`" c0000409"
            'g'
          ) | Set-Content -Path $cdbScript
          $nodeExe = node --print process.execPath

          $attempts = 40
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Output "::group::Attempt ${attempt}"
            if ($env:CDB) {
              & "${env:CDB}" -g -G -o -y $symbolPath -cf $cdbScript $nodeExe node_modules\vitest\vitest.mjs run packages/maxcso/test/index.test.ts 2>&1 |
                Tee-Object -Variable output
            } else {
              npx vitest run packages/maxcso/test/index.test.ts 2>&1 | Tee-Object -Variable output
            }
            $exitCode = $LASTEXITCODE
            Write-Output "::endgroup::"
            $dumps = Get-ChildItem -Path "${env:DUMP_DIR}" -Filter *.dmp -ErrorAction SilentlyContinue
            if ($exitCode -ne 0 -or $dumps -or ($output -match 'FAIL-FAST|exited unexpectedly|Test Files.*failed')) {
              Write-Output "Attempt ${attempt} failed with exit code ${exitCode}"
              exit 1
            }
          }
          Write-Output "No crash in ${attempts} attempts"

      # Print every thread's stack from each dump, symbolized with Node's and maxcso's PDBs
      - if: ${{ always() }}
        shell: pwsh
        run: |
          $dumps = Get-ChildItem -Path "${env:DUMP_DIR}" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) {
            Write-Output "No crash dumps were written"
            exit 0
          }
          Copy-Item -Path packages\maxcso\addon-maxcso\build\Release\*.pdb -Destination "${env:DUMP_DIR}"
          Copy-Item -Path "${env:NODE_PDB_DIR}\*.pdb" -Destination "${env:DUMP_DIR}" -ErrorAction SilentlyContinue
          if (-not $env:CDB) {
            Write-Output "No arm64 cdb.exe is installed, download the crash-dumps artifact to symbolize it"
            exit 0
          }
          $symbolPath = "${env:NODE_PDB_DIR};$(Resolve-Path packages\maxcso\addon-maxcso\build\Release);srv*${env:RUNNER_TEMP}\symbols*https://msdl.microsoft.com/download/symbols"
          foreach ($dump in $dumps) {
            Write-Output "::group::$($dump.Name)"
            & "${env:CDB}" -z $dump.FullName -y $symbolPath -c '.ecxr; kn 50; !analyze -v; ~*kn 50; q'
            Write-Output "::endgroup::"
          }
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxcso-crash-dumps
          path: ${{ env.DUMP_DIR }}
          if-no-files-found: ignore

  bun-unit:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --ignore-scripts
      - run: npm run test:unit:bun

  node-e2e:
    name: node-e2e (${{ matrix.node-version || 'package.json' }})
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    strategy:
      matrix:
        node-version: [ '', 22 ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Setup and install
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-
      - run: npm ci --foreground-scripts
      # Test the built files
      - run: ./test/endToEndTest.sh

  node-license:
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.should-test == 'true' }}
    permissions:
      contents: read # actions/checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.ref }}
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      # Install dependencies so we can check their licenses
      - run: npm ci --ignore-scripts
      - run: |
          cat > .licensee.json <<'EOF'
          {
            "licenses": {
              "spdx": [
                "0BSD",
                "Apache-2.0",
                "Artistic-2.0",
                "BlueOak-1.0.0",
                "BSD-2-Clause",
                "BSD-3-Clause",
                "BSD-3-Clause-Clear",
                "BSL-1.0",
                "CC-BY-4.0",
                "CC-BY-SA-4.0",
                "CC0-1.0",
                "CECILL-2.0",
                "CECILL-2.1",
                "ClArtistic",
                "CNRI-Python-GPL-Compatible",
                "EFL-2.0",
                "EUDatagrid",
                "FTL",
                "GPL-2.0-or-later",
                "GPL-3.0-only",
                "GPL-3.0-or-later",
                "HPND",
                "ICU",
                "IJG",
                "Intel",
                "ISC",
                "LGPL-2.1-or-later",
                "LGPL-3.0-only",
                "LGPL-3.0-or-later",
                "libpng-2.0",
                "MIT",
                "MIT-0",
                "MPL-2.0",
                "NCSA",
                "Python-2.0",
                "Ruby",
                "SGI-B-2.0",
                "Sleepycat",
                "SMLNJ",
                "Unicode-DFS-2016",
                "Unlicense",
                "UPL-1.0",
                "Vim",
                "W3C",
                "WTFPL",
                "X11",
                "Zend-2.0",
                "Zlib",
                "zlib-acknowledgement",
                "ZPL-2.1"
              ]
            }
          }
          EOF
          npx --yes licensee@latest --production --errors-only

  # !!! This check should be required by GitHub !!!
  test-status-check:
    needs:
      - path-filter
      - node-lint
      - node-unit
      - bun-unit
      - node-e2e
      - node-license
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: node-lint, node-unit, bun-unit, node-e2e, node-license
