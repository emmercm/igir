name: GitHub Issue Fix Commenter

on:
  issues:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  comment:
    if: ${{ github.event.issue.state_reason == 'completed' && !github.event.issue.locked }}
    permissions:
      issues: write # thollander/actions-comment-pull-request
      pull-requests: read # gh api graphql
    runs-on: ubuntu-latest
    steps:
      # Get the merged PRs that are marked as fixing the issue
      - id: pr-finder
        shell: bash
        run: |
          mapfile -t PR_URLS < <(gh api graphql \
            -F owner="${GITHUB_REPOSITORY_OWNER}" \
            -F repo="${GITHUB_REPOSITORY#*/}" \
            -F number="${ISSUE_NUMBER}" \
            -f query="${QUERY}" \
            --jq '.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.merged) | .url')
          if [ ${#PR_URLS[@]} -eq 0 ]; then
            echo "No merged pull requests are marked as fixing #${ISSUE_NUMBER}, skipping"
            exit 0
          fi
          echo "Found ${#PR_URLS[@]} merged PRs that fix #${ISSUE_NUMBER}:"
          for url in "${PR_URLS[@]}"; do
            echo " - ${url}"
          done

          PR_LIST="$(printf '%s, ' "${PR_URLS[@]}")"
          echo "PR_LIST=${PR_LIST%, }" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          QUERY: |
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  closedByPullRequestsReferences(first: 100, includeClosedPrs: true) {
                    nodes {
                      url
                      merged
                    }
                  }
                }
              }
            }

      - if: ${{ steps.pr-finder.outputs.PR_LIST }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## :white_check_mark: Fix merged
            @${{ github.event.issue.user.login }}, the fix for this issue was merged in ${{ steps.pr-finder.outputs.PR_LIST }} and will be included in the next release. Another comment will be posted here once that release is published.

            _Comment generated by the [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}) workflow._
          comment-tag: issue-fix
